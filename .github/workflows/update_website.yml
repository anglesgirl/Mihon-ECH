name: Update website

on:
  release:
    types: 
      - published
      - deleted
      - edited

jobs:
  update_website:
    # Fork has no token for the upstream mihonapp/website repo: every fork
    # release failed here with 401 Bad credentials. Upstream-only.
    if: github.repository == 'mihonapp/mihon'
    runs-on: 'ubuntu-26.04'

    steps:
      - name: Update website
        run: |
          curl --fail-with-body -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.MIHON_BOT_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/mihonapp/website/dispatches \
          -d '{"event_type":"app_release"}'
